
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | NOVARC STUDIO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f6f9;color:#101e35}
header{background:#101e35;color:white;padding:22px 7%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:bold;color:white;text-decoration:none}
.logo span{color:#a7b4c5}
header a:last-child{color:white;text-decoration:none}
main{max-width:850px;margin:55px auto;padding:20px}
.intro{text-align:center;margin-bottom:35px}
.intro p{color:#718096;font-size:12px;letter-spacing:2px;margin-bottom:12px}
h1{font-size:36px;margin-bottom:12px}
.intro .desc{font-size:15px;letter-spacing:0;line-height:1.7}
form{background:white;padding:35px;border-radius:12px;box-shadow:0 10px 35px #101e3510}
label{display:block;font-weight:bold;margin:18px 0 8px}
input,select,textarea{width:100%;padding:14px;border:1px solid #dce2e9;border-radius:6px;font-size:15px;background:white}
textarea{height:120px;resize:vertical}
button{width:100%;padding:16px;margin-top:25px;background:#101e35;color:white;border:0;border-radius:6px;font-size:15px;font-weight:bold;cursor:pointer}
button:hover{background:#263d5d}
.note{text-align:center;font-size:12px;color:#718096;margin-top:16px;line-height:1.6}
footer{text-align:center;padding:25px;color:#718096;font-size:12px}
@media(max-width:600px){h1{font-size:29px}form{padding:23px}main{margin:30px auto}}
</style>
</head>
<body>

<header>
<a href="index.html" class="logo">NOVARC<span>.</span></a>
<a href="index.html">← BACK TO HOME</a>
</header>

<main>
<div class="intro">
<p>NOVARC STUDIO · CONTACT</p>
<h1>Let's Discuss Your Project.</h1>
<div class="desc">
Tell us about your vision. Complete the form below
to prepare your project inquiry.
</div>
</div>

<form id="contactForm">
<label for="name">Full Name</label>
<input id="name" type="text" placeholder="Enter your name" required>

<label for="phone">Phone Number</label>
<input id="phone" type="tel" placeholder="Enter your phone number" required>

<label for="type">Project Type</label>
<select id="type" required>
<option value="">Select Project Type</option>
<option>Residential Building</option>
<option>Commercial Building</option>
<option>Interior Design</option>
<option>3D Visualization</option>
<option>Other</option>
</select>

<label for="details">Project Details</label>
<textarea id="details" placeholder="Describe your project requirements..." required></textarea>

<button type="submit">CONTINUE TO WHATSAPP</button>

<p class="note">
Your message will open in WhatsApp for you to review and send.
</p>
</form>
</main>

<footer>
© 2026 NOVARC STUDIO. All Rights Reserved.
</footer>

<script>
const form = document.getElementById("contactForm");

form.addEventListener("submit", function(event){
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const type = document.getElementById("type").value;
    const details = document.getElementById("details").value.trim();

    const whatsappNumber = "959759707342";

    const message =
`NOVARC STUDIO - PROJECT INQUIRY

Name: ${name}
Phone: ${phone}
Project Type: ${type}

Project Details:
${details}`;

    const url = "https://wa.me/" + whatsappNumber +
                "?text=" + encodeURIComponent(message);

    window.open(url, "_blank");
});
</script>

</body>
</html>
